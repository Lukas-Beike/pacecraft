name: Auto-rebase squash auto-merge PRs

on:
  push:
    branches:
      - develop
  # Dependabot can open a tool bump, and a PR can arm auto-merge, after the last
  # develop push; the schedule aligns and rebases them without waiting (#3854).
  # Scheduled runs use the default branch, develop. No pull-request trigger:
  # this job holds the app token.
  schedule:
    - cron: '*/10 * * * *'
  # A finished CI round lets the next PR rebase without waiting for the
  # schedule (#3979). It runs develop's copy of this file and reads nothing from
  # the triggering run, as for the schedule.
  workflow_run:
    workflows: ['Test and publish container image']
    types: [completed]

permissions:
  contents: read

# One group, so a push run and a scheduled run never update the same PR at
# once. A newer queued run replaces a queued push run; the next scheduled run
# then rebases what is still behind, at most one interval later (#3854).
concurrency:
  group: auto-rebase-develop
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Create branch update GitHub App token
        id: branch-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.0.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Dependabot runs receive no secrets, so its ruff/mypy bumps are aligned
      # here: trusted develop code reads the PR files as data and never runs them.
      - name: Check out trusted develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Align quality baseline tool versions in Dependabot PRs
        env:
          GH_TOKEN: ${{ steps.branch-app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          pull_request_rows="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --base develop \
              --state open \
              --author app/dependabot \
              --limit 1000 \
              --json number,headRefName,headRefOid,isCrossRepository \
              --jq '
                .[]
                | select(.isCrossRepository == false)
                | select(.headRefName | startswith("dependabot/"))
                | [.number, .headRefName, .headRefOid]
                | @tsv
              '
          )"
          if [[ -z "$pull_request_rows" ]]; then
            echo "No open Dependabot PR found."
            exit 0
          fi
          mapfile -t pull_requests <<< "$pull_request_rows"

          baseline_path=tests/fixtures/quality_baseline.json
          failed=0
          for pull_request in "${pull_requests[@]}"; do
            IFS=$'\t' read -r pull_request_number head_ref head_sha <<< "$pull_request"
            # The PR's two data files replace their copies in this throwaway
            # checkout; only trusted develop code runs. Read the exact head
            # commit; expectedHeadOid rejects the write if the branch moved.
            if ! gh api "repos/$REPOSITORY/contents/requirements-dev.txt?ref=$head_sha" \
                -H "Accept: application/vnd.github.raw+json" > requirements-dev.txt \
              || ! gh api "repos/$REPOSITORY/contents/$baseline_path?ref=$head_sha" \
                -H "Accept: application/vnd.github.raw+json" > "$baseline_path" \
              || ! result="$(env -u GH_TOKEN python tools/quality_baseline.py --align-versions)"; then
              echo "::warning::Could not check the quality baseline of PR #$pull_request_number ($head_ref)."
              failed=$((failed + 1))
              continue
            fi
            if [[ "$result" != "aligned" ]]; then
              continue
            fi
            echo "Aligning quality baseline tool versions in PR #$pull_request_number ($head_ref)."
            if ! gh api graphql \
              -f query='mutation($repo: String!, $branch: String!, $head: GitObjectID!, $path: String!, $content: Base64String!) {
                createCommitOnBranch(input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: $branch}
                  expectedHeadOid: $head
                  message: {headline: "build(deps): align quality baseline tool versions"}
                  fileChanges: {additions: [{path: $path, contents: $content}]}
                }) { commit { oid } }
              }' \
              -f repo="$REPOSITORY" \
              -f branch="$head_ref" \
              -f head="$head_sha" \
              -f path="$baseline_path" \
              -f content="$(base64 -w0 "$baseline_path")" > /dev/null; then
              echo "::warning::Could not align the quality baseline of PR #$pull_request_number ($head_ref)."
              failed=$((failed + 1))
            fi
          done

          if ((failed > 0)); then
            echo "Could not align $failed Dependabot pull request(s); see the warnings above."
            exit 1
          fi
      - name: Rebase eligible pull requests
        # A failed alignment must not block rebasing the other pull requests.
        # develop requires up-to-date branches, so every push leaves each armed PR
        # behind, but only one can merge next. Rebasing all of them restarted every
        # browser shard on each push (#3979): rebase one PR at a time, in arming
        # order, once its checks finished green, and none while an armed PR is up
        # to date and still running its checks. A finished CI round and the
        # schedule move the queue on, also for a PR armed after the last push
        # (#3854). A behind PR with failed checks stays for its owner.
        if: ${{ !cancelled() && steps.branch-app-token.outcome == 'success' }}
        env:
          # App-authored updates emit synchronize events and start fresh CI.
          GH_TOKEN: ${{ steps.branch-app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SCHEDULED: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail

          # Capture gh output before parsing: a failed gh call must fail this
          # step, which a process substitution would silently ignore.
          # Rows in arming order with the head's check state: green, pending
          # (also none reported yet), stale (pending, none started in 3 h, so a
          # stuck check cannot hold the queue) or failing.
          pull_request_rows="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --base develop \
              --state open \
              --limit 1000 \
              --json number,headRefName,headRefOid,isCrossRepository,autoMergeRequest,mergeable,statusCheckRollup \
              --jq '
                [.[]
                | select(.isCrossRepository == false)
                | select(.autoMergeRequest != null)
                | select(.autoMergeRequest.mergeMethod == "SQUASH")
                | select(.mergeable != "CONFLICTING")
                | .checks = [.statusCheckRollup[]?
                    | if .__typename == "CheckRun" then
                        (if .status != "COMPLETED" then "pending"
                         elif .conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL" then "passed"
                         else "failing" end)
                      elif .state == "PENDING" or .state == "EXPECTED" then "pending"
                      elif .state == "SUCCESS" then "passed"
                      else "failing" end]
                | .started = ([.statusCheckRollup[]?.startedAt // empty | select(startswith("20")) | fromdateiso8601] | max)]
                | sort_by(.autoMergeRequest.enabledAt)
                | .[]
                | [.number, .headRefName, .headRefOid,
                   (if any(.checks[]; . == "failing") then "failing"
                    elif (.checks | length) > 0 and all(.checks[]; . == "passed") then "green"
                    elif .started == null or .started > now - 10800 then "pending"
                    else "stale" end)]
                | @tsv
              '
          )"
          pull_requests=()
          if [[ -n "$pull_request_rows" ]]; then
            mapfile -t pull_requests <<< "$pull_request_rows"
          fi

          if ((${#pull_requests[@]} == 0)); then
            echo "No open same-repository PR with squash auto-merge found."
            exit 0
          fi

          # mergeStateStatus says BLOCKED, not BEHIND, while a check is pending
          # or failing, so ask how far the head is behind develop instead.
          ready=()
          failed=0
          for pull_request in "${pull_requests[@]}"; do
            IFS=$'\t' read -r pull_request_number head_ref head_sha checks <<< "$pull_request"
            if ! behind_by="$(gh api "repos/$REPOSITORY/compare/develop...$head_sha" --jq .behind_by)"; then
              echo "::warning::Could not compare PR #$pull_request_number ($head_ref) with develop."
              failed=$((failed + 1))
              continue
            fi
            if [[ "$behind_by" == "0" && "$checks" == "pending" ]]; then
              echo "PR #$pull_request_number ($head_ref) is up to date and running its checks; no PR is rebased before it."
              exit 0
            fi
            if [[ "$behind_by" != "0" && "$checks" == "green" ]]; then
              ready+=("$pull_request")
            elif [[ "$behind_by" != "0" ]]; then
              echo "PR #$pull_request_number ($head_ref) is behind develop with $checks checks; it is rebased once they finished green."
            fi
          done

          if ((${#ready[@]} == 0)); then
            echo "No armed PR is behind develop with finished green checks."
          fi

          # The first one that rebases is the only one; a conflict passes the turn on.
          for pull_request in "${ready[@]}"; do
            IFS=$'\t' read -r pull_request_number head_ref head_sha checks <<< "$pull_request"
            echo "Rebasing PR #$pull_request_number ($head_ref) onto develop."
            rebase_output=""
            if ! rebase_output="$(gh pr update-branch "$pull_request_number" \
              --repo "$REPOSITORY" \
              --rebase 2>&1)"; then
              if [[ "$rebase_output" =~ (RebaseConflictError|[Cc]onflict) ]]; then
                echo "::notice::Could not rebase PR #$pull_request_number ($head_ref) due to merge conflicts; skipping automatic rebase."
              else
                echo "::warning::Could not rebase PR #$pull_request_number ($head_ref): $rebase_output"
                failed=$((failed + 1))
              fi
              continue
            fi
            break
          done

          if ((failed > 0)); then
            echo "Could not rebase $failed pull request(s); see the warnings above."
            # A scheduled run only warns: a lasting failure would fail every run;
            # the next develop push fails the job and reports it.
            if [[ "$SCHEDULED" != "true" ]]; then
              exit 1
            fi
          fi
