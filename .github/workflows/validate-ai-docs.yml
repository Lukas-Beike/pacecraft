name: Validate repository AI documentation

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ai-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_DOCS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Require project guidance and its validator
        run: |
          test -f AGENTS.md
          test -f REVIEW.md
          test -f .agents/skills/README.md
          test -f tests/test_ai_docs_contract.py
      - name: Validate guidance, discovery, and local references
        run: python -m unittest discover -s tests -p test_ai_docs_contract.py -v
      # A strict OpenSpec warning fails the PR that introduces it, not later lanes (#3173).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the pinned OpenSpec CLI
        run: npm ci --ignore-scripts
      - name: Validate the OpenSpec main specs strictly
        run: python scripts/spec_validate.py
